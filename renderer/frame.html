<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Recording Monitor frame</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
      /* thick red border around the whole monitor, flashing about once per second */
      #f {
        position: fixed; inset: 0; box-sizing: border-box;
        border: 14px solid #ff1a1a; animation: flash 1s steps(1) infinite;
      }
      @keyframes flash { 0% { border-color: #ff1a1a; } 50% { border-color: rgba(255, 26, 26, 0.15); } }
    </style>
  </head>
  <body>
    <div id="f"></div>
  </body>
</html>
